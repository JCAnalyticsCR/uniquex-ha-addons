name: UniquexCR Mirror
# ÚNICO lugar que mira el Supervisor de HA para decidir si hay actualización.
# Si esto no sube, la casa no recibe nada aunque el código cambie.
# Mantener sincronizado con mirror_src/pyproject.toml (de ahí sale la versión
# que reporta /api/health).
version: "0.30.0"
slug: ha_mirror
# La caja BAJA esta imagen en vez de construirla.
#
# Hasta la 0.26.1 cada caja compilaba el add-on al instalarlo: 8 pasos de build,
# 102 dependencias de PyPI y la descarga de cloudflared. Entre 3 y 8 minutos por
# caja (medido en la primera instalacion real), y dependiendo de que PyPI, Debian
# y GitHub estuvieran arriba justo en ese momento, con el tecnico parado en la
# casa del cliente. Ahora se construye UNA vez por release, en CI
# (.github/workflows/construir-imagen.yml), y las cajas solo la descargan.
#
# {arch} lo reemplaza el Supervisor por la arquitectura del equipo (amd64 o
# aarch64), que son las dos que se publican.
#
# El paquete es PUBLICO a proposito: asi la caja lo baja sin ninguna credencial.
# Junto con el repositorio publico, eso elimina el token de todo el proceso —
# antes cada caja guardaba uno en la URL del repositorio, y revocarlo dejaba a
# toda la flota sin actualizaciones.
image: ghcr.io/jcanalyticscr/uniquex-mirror-{arch}
description: >-
  Mirror del frontend de lujo UniquexCR. Se conecta a Home Assistant de forma
  LOCAL (token del Supervisor, sin LLAT ni túnel) y expone estado + control por
  WebSocket para la app remota.
url: https://github.com/JCAnalyticsCR/uniquex-ha-addons/tree/main/ha_mirror
# Arquitecturas soportadas: mini PC Intel (amd64) y ARM 64-bit (aarch64 / Pi 4-5 64-bit)
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
# homeassistant_api: true → HA inyecta SUPERVISOR_TOKEN y da acceso al Core API
# local (http://supervisor/core y ws://supervisor/core/websocket). Con esto el
# Mirror NO necesita el LLAT de 10 años.
homeassistant_api: true
hassio_api: false
host_network: false
# Ingress: coloca el add-on en la barra lateral de HA y sirve `/` — la
# calcomanía de activación. El técnico que prepara la caja hace clic y ve el QR
# sin necesitar IP, API key ni terminal. Las peticiones por ingress ya vienen
# autenticadas por Home Assistant, así que las rutas de la UI quedan protegidas.
#
# El resto de las rutas (/api/*, /ws/*) sigue exigiendo X-API-Key: habilitar
# ingress NO las abre a usuarios sin token.
#
# Conviven con el puerto 8099 sin colisión:
#   - ingress → proxy interno de HA para la UI del panel (mdi:qrcode)
#   - ports   → binding directo en el host que el túnel Cloudflare de las
#               casas artesanales usa para enrutar el frontend desde Railway.
# Una casa artesanal real depende del puerto 8099 ahora mismo → no quitarlo.
ingress: true
# 8001, NO 8000: la calcomania corre en su propia app en ese puerto, que
# no se publica al host. Asi el ingress es el UNICO camino hasta ella y
# nadie en la red de la casa puede leer el codigo de activacion.
ingress_port: 8001
panel_icon: mdi:qrcode
panel_title: Activación
# Expone el puerto interno 8000 del Mirror en el puerto 8099 del host, para que
# el add-on de Cloudflared lo pueda enrutar por el túnel hacia el frontend.
ports:
  "8000/tcp": 8099
ports_description:
  "8000/tcp": "Puerto del Mirror — se expone por el túnel Cloudflare hacia el frontend"
options:
  mirror_api_key: ""
  # INTERRUPTOR MAESTRO del aprovisionamiento automatico (modo fabrica).
  # VACIA = casa artesanal: sin identidad de caja, sin reporte a ninguna
  # plataforma, sin tunel propio y sin calcomania de activacion. Una casa
  # instalada a mano actualiza el add-on y NO cambia nada.
  # Con valor = caja de producto: se enciende el QR, el reporte y el tunel.
  platform_base_url: ""
  frontend_origin: ""
  log_level: INFO
  go2rtc_base_url: ""
  go2rtc_username: ""
  go2rtc_password: ""
  camera_stream_map: "{}"
  camera_labels: "{}"
schema:
  mirror_api_key: "password?"
  platform_base_url: "str?"
  frontend_origin: "str?"
  log_level: "list(DEBUG|INFO|WARNING|ERROR)?"
  go2rtc_base_url: "str?"
  go2rtc_username: "str?"
  go2rtc_password: "password?"
  camera_stream_map: "str?"
  camera_labels: "str?"
