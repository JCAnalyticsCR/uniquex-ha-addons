[project]
name = "ha-mirror"
# Sincronizada con la version del add-on (ha_mirror/config.yaml).
# Estuvo congelada en 0.3.1 mientras el add-on iba en 0.20.0 — corregido en 0.21.0.
# Desde 0.22.0 esta es la version que /api/health reporta hacia afuera
# (main.py la lee con importlib.metadata del paquete instalado).
version = "0.26.1"
description = "FastAPI mirror para Home Assistant — single-tenant, WebSocket fan-out, Fernet at-rest"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aiohttp>=3.10",
    "pydantic>=2.8",
    "pydantic-settings>=2.5",
    "cryptography>=43",
    "structlog>=24",
    "aiosqlite>=0.20",
    "prometheus-client>=0.20",
    "itsdangerous>=2.2",
    # QR de la calcomanía de activación. Puro Python y CERO dependencias
    # transitivas — importa en una caja que va a la casa de un cliente: cada
    # paquete que entra es superficie que hay que auditar.
    "segno>=1.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
    "websockets>=12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ha_mirror"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "../09_tests/tests"]
